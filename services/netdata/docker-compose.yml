services:
  netdata:
    image: netdata/netdata:v1.46.3
    container_name: netdata
    restart: "no"
    profiles: ["managed"]
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}/application-data/netdata/config:/etc/netdata
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}/application-data/netdata/lib:/var/lib/netdata
      - netdata-cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_CLAIM_TOKEN=${NETDATA_CLAIM_TOKEN}
      - NETDATA_CLAIM_ROOMS=${NETDATA_CLAIM_ROOMS}
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.netdata.rule=Host(`monitor.${DOMAIN}`)"
      - "traefik.http.routers.netdata.entrypoints=admin"
      - "traefik.http.routers.netdata.tls.certresolver=letsencrypt"
      - "traefik.http.services.netdata.loadbalancer.server.port=19999"
    networks:
      - proxy

volumes:
  netdata-cache:

networks:
  proxy:
    external: true
