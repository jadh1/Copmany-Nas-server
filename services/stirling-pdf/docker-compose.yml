services:
  stirling-pdf:
    image: frooodle/s-pdf:0.32.0
    container_name: stirling-pdf
    restart: "no"
    profiles: ["managed"]
    volumes:
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}/application-data/stirling/tessdata:/usr/share/tessdata
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}/application-data/stirling/config:/configs
    environment:
      - TZ=${TZ}
      - DOCKER_ENABLE_SECURITY=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stirling.rule=Host(`pdf.${DOMAIN}`)"
      - "traefik.http.routers.stirling.entrypoints=admin"
      - "traefik.http.routers.stirling.tls.certresolver=letsencrypt"
      - "traefik.http.services.stirling.loadbalancer.server.port=8080"
    networks:
      - proxy

networks:
  proxy:
    external: true
