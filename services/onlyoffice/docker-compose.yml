services:
  onlyoffice:
    image: onlyoffice/documentserver:8.1.1.1
    container_name: onlyoffice
    restart: "no"
    profiles: ["managed"]
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
      - TZ=${TZ}
    volumes:
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}/onlyoffice/data:/var/www/onlyoffice/Data
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}/onlyoffice/logs:/var/log/onlyoffice
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}/onlyoffice/cache:/var/lib/onlyoffice
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}/onlyoffice/db:/var/lib/postgresql
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onlyoffice.rule=Host(`office.${DOMAIN}`)"
      - "traefik.http.routers.onlyoffice.entrypoints=websecure"
      - "traefik.http.routers.onlyoffice.tls.certresolver=letsencrypt"
      - "traefik.http.services.onlyoffice.loadbalancer.server.port=80"
      # Required headers for ONLYOFFICE to work correctly behind Traefik
      - "traefik.http.routers.onlyoffice.middlewares=onlyoffice-headers"
      - "traefik.http.middlewares.onlyoffice-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.onlyoffice-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.onlyoffice-headers.headers.stsIncludeSubdomains=true"
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

networks:
  proxy:
    external: true
