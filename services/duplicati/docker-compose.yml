services:
  duplicati:
    image: lscr.io/linuxserver/duplicati:2.1.0
    container_name: duplicati
    restart: "no"
    profiles: ["managed"]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - CLI_ARGS=
    volumes:
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}/application-data/duplicati:/config
      - ${STORAGE_ROOT:?STORAGE_ROOT must be set}:/source:ro
      - ${BACKUP_ROOT:?BACKUP_ROOT must be set}:/backups
      - /opt/server:/infrastructure:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.duplicati.rule=Host(`backup.${DOMAIN}`)"
      - "traefik.http.routers.duplicati.entrypoints=admin"
      - "traefik.http.routers.duplicati.tls.certresolver=letsencrypt"
      - "traefik.http.services.duplicati.loadbalancer.server.port=8200"
      # Restrict to admin only via Traefik IP whitelist or VPN only
      - "traefik.http.routers.duplicati.middlewares=duplicati-auth"
      - "traefik.http.middlewares.duplicati-auth.basicauth.users=${TRAEFIK_DASHBOARD_PASSWORD_HASH}"
    networks:
      - proxy

networks:
  proxy:
    external: true
